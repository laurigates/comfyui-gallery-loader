name: Registry health

# Feedback loop for Comfy Registry publishing. Checks that the version this
# repo currently declares (pyproject.toml) is actually Active in the registry.
#
# Two visible outputs:
#   1. A commit status "Comfy Registry / scan" on the release commit — the
#      registry verdict shows up as a check (green Active / red Flagged,
#      Banned or Deleted / yellow pending) next to CI in the Actions + commit UI.
#   2. A tracking issue (label registry-health) opened/updated when the version
#      is Flagged, Banned, Deleted, stuck Pending, or missing, and closed once it
#      goes Active. Flagged, Banned and Deleted issues name the version /install
#      resolves to: Flagged still installs, Banned falls back to an older
#      version, and Deleted is expected to (not yet verified against /install).
#      Each alert carries a hidden marker; a run whose verdict matches the
#      newest marker on the open issue posts nothing, and an unchanged Flagged
#      verdict ends with a warning instead of failing the run.
#
# The registry security scan is async: a freshly published version is Pending
# for a while before it flips to Active or Flagged. So a run triggered right
# after Publish polls for a bounded window until the version leaves Pending,
# instead of reporting a premature "pending, fine". Schedule/dispatch runs
# evaluate once and defer to the pending grace window.

on:
  workflow_dispatch:
  schedule:
    - cron: "17 7 * * *" # daily 07:17 UTC (backstop for scans slower than the poll window)
  workflow_run:
    workflows: ["Publish to Comfy Registry"]
    types: [completed]

permissions:
  contents: read
  issues: write
  statuses: write # emit the "Comfy Registry / scan" commit status

jobs:
  check:
    name: Check registry release status
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Evaluate registry status
        env:
          GH_TOKEN: ${{ github.token }}
          PENDING_GRACE_HOURS: "6" # scan normally completes well under this
          ISSUE_LABEL: "registry-health"
          # Commit the status to the release commit that triggered Publish;
          # otherwise (schedule/dispatch) to the checked-out HEAD.
          STATUS_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          STATUS_CONTEXT: "Comfy Registry / scan"
          # Bounded post-publish poll (workflow_run only): wait for the async
          # scan to leave Pending. 20 x 90s ≈ 30 min; slower scans defer to the
          # daily schedule. A stuck Pending is still caught by the grace check.
          POLL_ATTEMPTS: "20"
          POLL_INTERVAL_SECS: "90"
        run: |
          set -euo pipefail

          node_id=$(grep -m1 -E '^name'    pyproject.toml | sed -E 's/.*"([^"]+)".*/\1/')
          ver=$(grep    -m1 -E '^version' pyproject.toml | sed -E 's/.*"([^"]+)".*/\1/')
          [ -n "$node_id" ] && [ -n "$ver" ] || { echo "::error::cannot read name/version from pyproject.toml"; exit 1; }
          echo "Node: $node_id  declared version: $ver  status-sha: ${STATUS_SHA}"

          dash="https://registry.comfy.org/nodes/${node_id}"

          # Publish a commit status so the registry verdict is a visible check.
          # <state> in {pending,success,failure}, <description> short free text.
          set_status() {
            gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${STATUS_SHA}" \
              -f state="$1" \
              -f context="${STATUS_CONTEXT}" \
              -f description="$2" \
              -f target_url="$dash" >/dev/null 2>&1 \
              || echo "::warning::could not set commit status ($1: $2)"
          }

          # include_status_reason=true returns the security-scan findings JSON
          # (issue_type/file_path/description) — the closed feedback loop for
          # Flagged versions (scanner notifications otherwise land only in the
          # Comfy Org Discord #security-review-council channel).
          fetch() {
            curl -fsS "https://api.comfy.org/nodes/${node_id}/versions?include_status_reason=true" -o versions.json
          }

          # Poll only right after a publish; wait until the version appears AND
          # leaves Pending, or the window expires. Other triggers evaluate once.
          status=""; created=""
          for i in $(seq 1 "${POLL_ATTEMPTS}"); do
            fetch
            status=$(jq  -r --arg v "$ver" '.[] | select(.version==$v) | .status'    versions.json)
            created=$(jq -r --arg v "$ver" '.[] | select(.version==$v) | .createdAt' versions.json)
            if [ -n "$status" ] && [ "$status" != "NodeVersionStatusPending" ]; then break; fi
            [ "${GITHUB_EVENT_NAME}" = "workflow_run" ] || break
            if [ "$i" -lt "${POLL_ATTEMPTS}" ]; then
              echo "attempt ${i}/${POLL_ATTEMPTS}: status=${status:-missing} — waiting ${POLL_INTERVAL_SECS}s"
              set_status pending "Registry scan running (${status:-uploading})…"
              sleep "${POLL_INTERVAL_SECS}"
            fi
          done

          highest=$(jq -r '.[].version' versions.json | sort -V | tail -1)
          body=$(mktemp); problem=""

          if [ -z "$status" ]; then
            problem="missing"
            printf '%s\n' \
              "Declared version **\`${ver}\`** is **not present** in the registry." \
              "" \
              "The publish either failed, is still uploading, or release-please hasn't cut it yet." \
              "Check the publish workflow and ${dash}." > "$body"
          elif [ "$status" = "NodeVersionStatusFlagged" ] || [ "$status" = "NodeVersionStatusBanned" ] \
            || [ "$status" = "NodeVersionStatusDeleted" ]; then
            # An absent/empty status_reason yields no bullet at all, so the
            # list falls back to "(none reported)" rather than a bare "  - ".
            findings=$(jq -r --arg v "$ver" '.[] | select(.version==$v) | .status_reason // ""
              | select(. != "")
              | (fromjson? // .)
              | if type=="array" then
                  map("  - `\(.issue_type // .error_type // .type // "?")` (\(.scanner // "?")) in `\(.file_path // .path // "?")`: \(.description // "" | tostring | .[0:200])")
                  | join("\n")
                else "  - \(tostring | .[0:400])" end' versions.json)
            # What a clean install actually gets. /install returns the newest
            # NON-BANNED version: Flagged still installs, Banned falls back —
            # possibly to a very old, itself-deprecated version. Deleted is
            # expected to fall back too (not yet verified against /install).
            install_json=$(curl -fsS "https://api.comfy.org/nodes/${node_id}/install" 2>/dev/null) || install_json=""
            resolved=$(jq -r '.version // empty' <<<"$install_json" 2>/dev/null) || resolved=""
            resolved_note=$(jq -r 'if .deprecated == true then " (itself marked `deprecated`)" else "" end' <<<"$install_json" 2>/dev/null) || resolved_note=""
            if [ -n "$resolved" ]; then
              installs="\`/install\` resolves to **\`${resolved}\`**${resolved_note}"
            else
              installs="the version \`/install\` resolves to could not be read (request failed)"
            fi
            listing=""
            remedy="- If a false positive, request re-review via Comfy-Org (registry-backend#180); a new publish re-runs the scan."
            if [ "$status" = "NodeVersionStatusBanned" ]; then
              problem="banned"
              impact="- Clean installs skip a Banned version and fall back to the newest non-banned one: ${installs}. The fallback can be much older than \`${ver}\`."
              header="Declared version **\`${ver}\`** is **Banned** by Comfy-Org registry moderation."
            elif [ "$status" = "NodeVersionStatusDeleted" ]; then
              problem="deleted"
              impact="- Clean installs are expected to fall back to an older version (not yet verified against \`/install\`): ${installs}. The fallback can be much older than \`${ver}\`."
              header="Declared version **\`${ver}\`** is **Deleted** from the Comfy Registry."
              remedy="- Publish a new version (> \`${ver}\`) to supersede it, or check ${dash} if the deletion was unintended."
            else
              problem="flagged"
              listed=$(curl -fsS "https://api.comfy.org/nodes/${node_id}" 2>/dev/null | jq -r '.latest_version.version // empty' 2>/dev/null) || listed=""
              if [ "$resolved" = "$ver" ]; then
                impact="- Installs are unaffected (Flagged is not Banned): ${installs}, the flagged version itself."
              else
                impact="- Flagged is not Banned, so installs are not blocked by this status: ${installs}."
              fi
              listing="- Discoverability is affected: the registry listing's \`latest_version\` counts only Active versions, so it shows **\`${listed:-none}\`** rather than \`${ver}\`."
              header="Declared version **\`${ver}\`** is **Flagged** by Comfy-Org registry moderation."
            fi
            {
              printf '%s\n' "$header" "" "$impact"
              [ -z "$listing" ] || printf '%s\n' "$listing"
              # Deletion is not a scan verdict, so a Deleted body has no
              # findings section — not even "(none reported)".
              if [ "$problem" != "deleted" ]; then
                printf '%s\n' \
                  "- Scan findings (\`include_status_reason=true\`):" \
                  "${findings:-  - (none reported)}"
              fi
              printf '%s\n' "$remedy"
            } > "$body"
          elif [ "$status" = "NodeVersionStatusPending" ]; then
            age_h=$(( ( $(date -u +%s) - $(date -u -d "$created" +%s) ) / 3600 ))
            if [ "$age_h" -ge "${PENDING_GRACE_HOURS}" ]; then
              problem="stuck-pending"
              printf '%s\n' \
                "Declared version **\`${ver}\`** has been **Pending** ~${age_h}h (grace ${PENDING_GRACE_HOURS}h)." \
                "The security scan normally finishes in under a few hours. Check ${dash}." > "$body"
            fi
          fi

          # Phantom-ahead: a higher version exists in the registry than we declare.
          phantom=""
          if [ "$highest" != "$ver" ] && [ "$(printf '%s\n%s\n' "$ver" "$highest" | sort -V | tail -1)" = "$highest" ]; then
            phantom="$highest"
          fi
          if [ -n "$phantom" ]; then
            { echo ""; echo "> ⚠️ Phantom version **\`${phantom}\`** outranks the declared \`${ver}\` in the registry — \`comfy node install\` resolves to \`${phantom}\`. Release a version **> ${phantom}** (e.g. \`Release-As\`) to supersede it."; } >> "$body"
            [ -n "$problem" ] || problem="phantom-ahead"
          fi

          # Map the verdict onto the visible commit status.
          if [ -n "$problem" ]; then
            set_status failure "${problem}: v${ver}"
          elif [ "$status" = "NodeVersionStatusPending" ]; then
            set_status pending "Scan still running (v${ver}) — awaiting next check"
          else
            set_status success "Active in registry (v${ver})"
          fi

          gh label create "$ISSUE_LABEL" --color FBCA04 --description "Comfy Registry publish health" --force >/dev/null 2>&1 || true
          # No error suppression: a failed lookup must fail the run, not read
          # as "no open issue" and open a duplicate.
          existing=$(gh issue list --label "$ISSUE_LABEL" --state open --json number --jq '.[0].number')

          if [ -n "$problem" ]; then
            # The marker identifies the verdict, so a repeat run can tell it
            # already reported this one. It renders as nothing.
            marker="<!-- registry-health ver=${ver} problem=${problem} phantom=${phantom:-none} -->"
            title="Registry: release ${ver} not healthy (${problem})"
            { echo "_Detected by the registry-health workflow on $(date -u +%FT%TZ)._"; echo "$marker"; } >> "$body"
            unchanged=""
            if [ -z "$existing" ]; then
              gh issue create --title "$title" --label "$ISSUE_LABEL" --body-file "$body"
            else
              # Newest marker this workflow wrote, from the issue body or any
              # comment; comments without a marker (people, older runs) are skipped.
              alerts=$(gh issue view "$existing" --json body,comments \
                --jq '[.body] + [.comments[].body] | map(select(contains("<!-- registry-health "))) | last // ""')
              last=$(grep -oE '<!-- registry-health [^>]*-->' <<<"$alerts" | tail -n1 || true)
              if [ "$last" = "$marker" ]; then
                unchanged=1
                echo "::notice::same verdict as the last alert on #${existing} (${ver} ${problem}); not commenting again"
              else
                gh issue comment "$existing" --body-file "$body"
                gh issue edit "$existing" --title "$title"
              fi
            fi
            # Flagged still installs, so an unchanged Flagged verdict needs no
            # new action and should not turn the schedule red every day. The
            # commit status set above stays failure, so the verdict stays visible.
            if [ -n "$unchanged" ] && [ "$problem" = "flagged" ]; then
              echo "::warning::release ${ver} is still flagged, unchanged since the last alert on #${existing}"
              exit 0
            fi
            echo "::error::release ${ver} is ${problem}"
            exit 1
          fi

          if [ "$status" = "NodeVersionStatusPending" ]; then
            echo "::notice::${ver} still Pending after poll window — deferring to the next scheduled run"
            exit 0
          fi

          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Resolved: \`${ver}\` is **Active** and highest in the registry. Closing."
            gh issue close "$existing"
          fi
          echo "OK: ${ver} is Active"
