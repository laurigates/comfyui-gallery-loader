name: Publish to Comfy Registry

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  publish-node:
    name: Publish custom node to registry
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies and build frontend
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Publish Custom Node
        # Pinned to the commit that supports `skip_checkout`. The `@v1` and
        # tagged `1.0.x` releases predate that input: they run an
        # unconditional actions/checkout that wipes the git-ignored web/dist
        # built above, so `comfy node publish` ships an EMPTY web/dist and the
        # frontend extension never loads. No tag carries the fix yet, so we
        # pin the immutable main SHA.
        uses: Comfy-Org/publish-node-action@d2366e7abb6ab16f3bb03e3520ae25c8cf749bc9 # main: skip_checkout support
        with:
          # Personal access token issued at https://registry.comfy.org/
          # Stored as a repo secret named REGISTRY_ACCESS_TOKEN.
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
          # Reuse the workspace the prior step already built. `bun run build`
          # emits web/dist/ (git-ignored, force-shipped via [tool.comfy]
          # includes). Without skip_checkout the action runs its own
          # actions/checkout, wiping web/dist before `comfy node publish`, so the
          # registry tarball ships an empty web/dist and the extension never loads.
          skip_checkout: 'true'
