name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-python:
    name: Lint & format (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        run: uv python install 3.12

      - name: Ruff check
        run: uvx ruff check .

      - name: Ruff format check
        run: uvx ruff format --check .

  lint-js:
    name: Lint & format (JavaScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Biome
        uses: biomejs/setup-biome@v2
        with:
          # Pin to the schema version declared in biome.json.
          version: 2.4.15

      - name: Biome check
        run: biome check .

  typecheck-build:
    name: Typecheck & build (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build
      - name: Verify committed web/dist is up to date
        run: |
          if ! git diff --exit-code -- web/dist; then
            echo "::error::web/dist is stale vs src/. Run 'bun run build' and commit web/dist."
            exit 1
          fi

  test:
    name: Tests (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        run: uv python install 3.12

      - name: Run tests
        run: uv run --group dev pytest -v

  test-js:
    name: Tests (JavaScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dev dependencies
        run: bun install --frozen-lockfile

      - name: Run Vitest
        run: bun run test

  test-e2e:
    # The browser suite. Its own job on purpose: it needs a Chromium download
    # that no other job wants, and as a parallel job it adds nothing to the
    # critical path. It is also the ONLY suite that can see the picker's scroll
    # behaviour: jsdom does no layout, so it neither clamps `scrollTop` nor
    # answers 0 from a detached element. Measured: rebuilding the bundle from
    # the pre-change `src/image-picker.ts` fails 14 of the 16 tests here while
    # `bun run test` stays green.
    name: Tests (browser, Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install Chromium for Playwright
        # Chromium only — the suite declares a single chromium project, and the
        # other engines are a download this job would never use.
        run: bunx playwright install --with-deps chromium
      - name: Build the served bundle
        # The fixture serves web/dist/index.js at its real extension URL, so the
        # suite must run against a bundle built from this commit's src/. (That
        # the COMMITTED web/dist matches src/ is typecheck-build's assertion,
        # not this job's.)
        run: bun run build
      - name: Run the browser suite
        run: bun run test:e2e
      - name: Upload traces from failed tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: tests/e2e/test-results/
          retention-days: 7
          if-no-files-found: ignore

  vendored-drift:
    name: Vendored modules match canonical
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Diff image_meta.py against comfyui-image-browser@main
        run: |
          curl -fsSL https://raw.githubusercontent.com/laurigates/comfyui-image-browser/main/image_meta.py | diff -u - image_meta.py || {
            echo "::error::image_meta.py drifted from its canonical home (comfyui-image-browser). Run 'just sync-image-meta' — or land the fix upstream first."
            exit 1
          }

  security:
    name: Security scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # gitleaks scans <prev>^..<head>; needs full history.
          fetch-depth: 0

      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
